android.useAndroidX=true
org.gradle.configuration-cache=true

# Memory limits for the build server (3.8 GB RAM, 2 CPUs, shared with other projects).
# Builds with -Xmx2g and parallel processes pushed the server into swap and broke the build.
# Build and test only through tools/aikb/build.sh (see CLAUDE.md).
org.gradle.jvmargs=-Xmx1g -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false
# Kotlin compiles inside the Gradle process (within its 1 GB): a separate Kotlin daemon (-Xmx768m) reached
# 1.1 GB RSS and stayed idle next to Gradle during dexing and tests, the server then had only 200-300 MB left.
kotlin.compiler.execution.strategy=in-process
# Used only if the strategy above is switched back to "daemon".
# The Gradle property is kotlin.daemon.jvmargs; "kotlin.daemon.jvm.options" works only as -D inside
# org.gradle.jvmargs and is ignored here (the Kotlin daemon then inherited -Xmx1g from Gradle and ParallelGC).
kotlin.daemon.jvmargs=-Xmx768m -XX:+UseSerialGC
